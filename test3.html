<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag & Drop Upload Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family: 'Pretendard Variable', Pretendard, sans-serif;
        background-color: #f4f5f7;
      }
      .no-ring:focus {
        outline: none;
        box-shadow: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* 드래그 앤 드롭 애니메이션 보정 */
      .drag-over {
        transform: scale(1.05);
        border-color: #6366f1 !important; /* indigo-500 */
        box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center py-12 px-6">
    <main class="w-full max-w-[1200px]">
      <div class="flex items-end justify-between mb-8 px-2">
        <div>
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
            새 작업물 게시
          </h1>
          <p class="text-sm font-medium text-slate-500 mt-1.5">
            썸네일을 드래그하여 순서를 변경하고 대표 이미지를 설정하세요. (최대
            3장)
          </p>
        </div>
        <div
          class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 rounded-full shadow-sm text-xs font-bold text-slate-600"
        >
          <span
            class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
          ></span>
          자동 저장됨
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
        <!-- ==========================================
           LEFT: 반응형 멀티 미디어 캔버스 (Drag & Drop)
      ========================================== -->
        <div
          class="lg:col-span-5 bg-white rounded-[2rem] p-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 flex flex-col h-[600px]"
        >
          <!-- 숨겨진 파일 인풋 -->
          <input
            id="file-input-add"
            type="file"
            multiple
            accept="image/*"
            class="hidden"
          />
          <input
            id="file-input-replace"
            type="file"
            accept="image/*"
            class="hidden"
          />

          <!-- 1. 메인 대형 프리뷰 캔버스 -->
          <div
            id="main-preview-container"
            class="relative flex-1 group overflow-hidden rounded-[1.5rem] border-2 border-dashed border-slate-200 bg-slate-50/50 hover:bg-indigo-50/30 hover:border-indigo-400 transition-all duration-300 flex flex-col items-center justify-center text-center"
          >
            <!-- JS 렌더링 -->
          </div>

          <!-- 2. 하단 썸네일 스트립 (Drag & Drop 컨테이너) -->
          <div
            id="thumbnail-container"
            class="mt-4 flex items-center gap-3 px-1 overflow-x-auto no-scrollbar pb-1 min-h-[5rem]"
          >
            <!-- JS 렌더링 -->
          </div>
        </div>

        <!-- ==========================================
           RIGHT: 메타데이터 에디터 
      ========================================== -->
        <div
          class="lg:col-span-7 bg-white rounded-[2rem] p-8 sm:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 flex flex-col h-[600px]"
        >
          <div
            class="flex items-center justify-between border-b border-slate-100 pb-6 mb-6"
          >
            <div
              class="bg-slate-100/80 p-1.5 rounded-2xl inline-flex items-center"
            >
              <button
                class="px-5 py-2 rounded-xl text-xs font-extrabold bg-white text-slate-900 shadow-sm transition-all"
              >
                작품 갤러리
              </button>
              <button
                class="px-5 py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-900 transition-all"
              >
                커뮤니티 게시판
              </button>
            </div>
            <button
              class="flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-slate-900 transition-colors"
            >
              <i data-lucide="globe" class="w-4 h-4"></i> 전체 공개
            </button>
          </div>

          <div
            class="flex-1 flex flex-col space-y-6 overflow-y-auto no-scrollbar pb-4"
          >
            <div>
              <input
                type="text"
                placeholder="멋진 작품의 제목을 지어주세요"
                class="w-full text-3xl sm:text-4xl font-extrabold text-slate-900 placeholder:text-slate-300 bg-transparent border-none p-0 no-ring"
              />
            </div>
            <div class="flex-1 min-h-[160px]">
              <textarea
                placeholder="작품의 비하인드 스토리, 사용한 소프트웨어 등 자세한 이야기를 들려주세요..."
                class="w-full h-full text-sm font-medium text-slate-600 placeholder:text-slate-300 bg-slate-50/50 hover:bg-slate-50 focus:bg-slate-50 rounded-2xl border border-transparent focus:border-slate-200 p-5 no-ring resize-none transition-colors"
              ></textarea>
            </div>
            <div>
              <label
                class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-3"
                >태그 (Keywords)</label
              >
              <div class="flex flex-wrap items-center gap-2">
                <span
                  class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold shadow-sm"
                >
                  #3D아트
                  <i
                    data-lucide="x"
                    class="w-3 h-3 cursor-pointer hover:text-rose-400"
                  ></i>
                </span>
                <input
                  type="text"
                  placeholder="+ 새 태그 입력..."
                  class="bg-transparent border-none text-xs font-bold text-slate-700 placeholder:text-slate-400 p-1 no-ring w-32"
                />
              </div>
            </div>
          </div>

          <div
            class="pt-6 border-t border-slate-100 flex items-center justify-between mt-auto"
          >
            <button
              class="px-5 py-2.5 text-xs font-bold text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-colors"
            >
              취소
            </button>
            <div class="flex gap-3">
              <button
                class="px-5 py-2.5 text-xs font-bold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl shadow-sm transition-all"
              >
                임시저장
              </button>
              <button
                class="px-7 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold rounded-xl shadow-[0_4px_14px_0_rgb(79,70,229,0.39)] hover:shadow-[0_6px_20px_rgba(79,70,229,0.23)] hover:-translate-y-0.5 transition-all flex items-center gap-2"
                onclick="alert('업로드 성공!')"
              >
                작품 게시하기 <i data-lucide="rocket" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ==========================================
       Drag & Drop 멀티 이미지 업로드 로직
  ========================================== -->
    <script>
      const MAX_IMAGES = 3;
      let images = [];
      let currentIndex = 0;
      let draggedIndex = null; // 드래그 중인 이미지의 인덱스를 저장하는 변수

      const mainContainer = document.getElementById('main-preview-container');
      const thumbContainer = document.getElementById('thumbnail-container');
      const inputAdd = document.getElementById('file-input-add');
      const inputReplace = document.getElementById('file-input-replace');

      // 1. 이미지 추가 로직
      inputAdd.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        files.forEach((file) => {
          if (images.length >= MAX_IMAGES) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            images.push(event.target.result);
            currentIndex = images.length - 1;
            renderUI();
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      });

      // 2. 이미지 교체 로직
      inputReplace.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          images[currentIndex] = event.target.result;
          renderUI();
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      window.selectImage = function (index) {
        currentIndex = index;
        renderUI();
      };

      window.removeImage = function (index, event) {
        event.stopPropagation();
        images.splice(index, 1);
        if (images.length === 0) currentIndex = 0;
        else if (currentIndex >= images.length)
          currentIndex = images.length - 1;
        renderUI();
      };

      // ==========================================
      // ⭐ 드래그 앤 드롭 (Drag & Drop) 핵심 로직
      // ==========================================
      window.handleDragStart = function (index, e) {
        draggedIndex = index;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', index); // 파이어폭스 호환성
        // 드래그 시작 시 원본 썸네일 살짝 투명하게 처리
        setTimeout(() => e.target.classList.add('opacity-30'), 0);
      };

      window.handleDragOver = function (e) {
        e.preventDefault(); // 드롭 허용 필수
        e.dataTransfer.dropEffect = 'move';
      };

      window.handleDragEnter = function (e) {
        e.preventDefault();
        // 올린 위치에 강조 효과 (css drag-over 클래스)
        if (e.currentTarget.classList)
          e.currentTarget.classList.add('drag-over');
      };

      window.handleDragLeave = function (e) {
        // 위치 벗어나면 강조 효과 제거
        if (e.currentTarget.classList)
          e.currentTarget.classList.remove('drag-over');
      };

      window.handleDrop = function (targetIndex, e) {
        e.preventDefault();
        e.stopPropagation();
        e.currentTarget.classList.remove('drag-over');

        if (draggedIndex !== null && draggedIndex !== targetIndex) {
          // 배열 순서 재조정 (드래그한 요소를 빼서 새 위치에 끼워넣기)
          const draggedItem = images.splice(draggedIndex, 1)[0];
          images.splice(targetIndex, 0, draggedItem);

          // 화면 포커스를 방금 이동시킨 이미지로 맞춰줌
          currentIndex = targetIndex;
        }
        draggedIndex = null;
        renderUI();
      };

      window.handleDragEnd = function (e) {
        e.target.classList.remove('opacity-30');
        draggedIndex = null;
        renderUI(); // 에러 방지용 리렌더링
      };

      // ==========================================
      // 5. 화면 렌더링 함수
      // ==========================================
      function renderUI() {
        // --- 메인 프리뷰 캔버스 렌더링 ---
        if (images.length === 0) {
          mainContainer.className =
            'relative flex-1 group cursor-pointer overflow-hidden rounded-[1.5rem] border-2 border-dashed border-slate-300 bg-slate-50/50 hover:bg-indigo-50/30 hover:border-indigo-400 transition-all duration-300 flex flex-col items-center justify-center text-center';
          mainContainer.onclick = () => inputAdd.click();
          mainContainer.innerHTML = `
          <div class="w-16 h-16 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:text-indigo-600 transition-all">
            <i data-lucide="image-plus" class="w-7 h-7 text-slate-400 group-hover:text-indigo-500 transition-colors"></i>
          </div>
          <h3 class="text-base font-extrabold text-slate-900 mb-1">여기를 클릭하여 이미지 업로드</h3>
          <p class="text-xs font-medium text-slate-500 max-w-[200px]">최대 ${MAX_IMAGES}장까지 드래그 앤 드롭으로 순서를 바꿀 수 있습니다.</p>
        `;
        } else {
          mainContainer.className =
            'relative flex-1 group cursor-pointer overflow-hidden rounded-[1.5rem] border border-slate-100 bg-slate-950 transition-all duration-300 flex flex-col items-center justify-center text-center shadow-inner';
          mainContainer.onclick = () => inputReplace.click();

          const isCover = currentIndex === 0; // 1번째 이미지는 대표 뱃지 부여
          const coverBadge = isCover
            ? `<span class="absolute top-4 left-4 bg-indigo-500 text-white text-xs font-extrabold px-3 py-1.5 rounded-lg shadow-md tracking-wider z-10 flex items-center gap-1"><i data-lucide="star" class="w-3 h-3 fill-current"></i> 대표 이미지</span>`
            : '';

          mainContainer.innerHTML = `
          ${coverBadge}
          <img src="${images[currentIndex]}" alt="Main Image" class="absolute inset-0 w-full h-full object-contain opacity-90 transition-transform duration-500" />
          <div class="absolute inset-0 bg-slate-900/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center backdrop-blur-sm z-20">
            <div class="px-5 py-2.5 bg-white text-slate-900 rounded-full text-xs font-extrabold shadow-lg flex items-center gap-2 hover:scale-105 transition-transform">
              <i data-lucide="refresh-cw" class="w-4 h-4 text-indigo-500"></i> 클릭하여 이미지 교체
            </div>
          </div>
        `;
        }

        // --- 하단 썸네일 스트립 렌더링 (드래그 앤 드롭 적용) ---
        thumbContainer.innerHTML = '';

        images.forEach((src, idx) => {
          const isCover = idx === 0;
          const isActive = idx === currentIndex;

          const activeClass = isActive
            ? 'border-indigo-500 shadow-md'
            : 'border-slate-200 opacity-60 hover:opacity-100 hover:border-indigo-300';
          const coverBadge = isCover
            ? `<span class="absolute top-0 left-0 bg-indigo-500 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded-br-lg shadow-sm tracking-wider z-10 pointer-events-none">COVER</span>`
            : '';

          // 썸네일에 드래그 이벤트 (ondragstart, ondrop 등) 등록
          // 포인터 이벤트(pointer-events-none)를 내부에 적용해 드래그 중 버그 방지
          thumbContainer.innerHTML += `
          <div draggable="true"
               ondragstart="handleDragStart(${idx}, event)"
               ondragover="handleDragOver(event)"
               ondragenter="handleDragEnter(event)"
               ondragleave="handleDragLeave(event)"
               ondrop="handleDrop(${idx}, event)"
               ondragend="handleDragEnd(event)"
               class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl border-2 ${activeClass} overflow-hidden shrink-0 group cursor-grab active:cursor-grabbing transition-all duration-200" 
               onclick="selectImage(${idx})">
            ${coverBadge}
            <img src="${src}" alt="Thumb ${idx}" class="w-full h-full object-cover pointer-events-none" />
            
            <button class="absolute top-1.5 right-1.5 w-5 h-5 bg-black/60 hover:bg-rose-500 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all backdrop-blur-md z-20" onclick="removeImage(${idx}, event)">
              <i data-lucide="x" class="w-3 h-3 pointer-events-none"></i>
            </button>
          </div>
        `;
        });

        // 등록된 이미지가 최대치(3장) 미만일 경우에만 [ + 추가 ] 버튼 생성
        if (images.length < MAX_IMAGES) {
          thumbContainer.innerHTML += `
          <label class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 hover:text-indigo-500 hover:border-indigo-400 hover:bg-indigo-50/50 transition-all cursor-pointer shrink-0" onclick="document.getElementById('file-input-add').click()">
            <i data-lucide="plus" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-bold">${images.length}/3</span>
          </label>
        `;
        }

        lucide.createIcons();
      }

      renderUI();
    </script>
  </body>
</html>
